name: Android APK

# Konstwi app Android KayOu (wrapper Capacitor ki louvri sit la nan yon WebView).
# URL sit la soti nan input "app_url" la, oswa nan varyab repo "APP_URL"
# (Settings → Secrets and variables → Actions → Variables).

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL HTTPS sit KayOu a (pa obligatwa si vars.APP_URL defini)"
        required: false
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - "wwwroot/icons/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      APP_URL: ${{ github.event.inputs.app_url || vars.APP_URL }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verifye APP_URL
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Mete varyab repo APP_URL (egz. https://kayou.ht) oswa bay app_url lè w lanse workflow la."
            exit 1
          fi
          case "$APP_URL" in https://*) ;; *) echo "::error::APP_URL dwe kòmanse ak https://"; exit 1;; esac

      - name: Enstale depandans
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick

      - name: Mete URL la nan capacitor.config.json
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.server.url = process.env.APP_URL.replace(/\/+$/, "");
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          cat capacitor.config.json

      - name: Kreye pwojè Android la
        run: npx cap add android

      - name: Jenere ikòn ak splash
        run: |
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 ../wwwroot/icons/icon.svg -o assets/icon-only.png
          convert -size 2732x2732 xc:'#2C1810' \( assets/icon-only.png -resize 800x800 \) \
            -gravity center -composite assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#2C1810' --iconBackgroundColorDark '#2C1810' \
            --splashBackgroundColor '#2C1810' --splashBackgroundColorDark '#2C1810'

      - name: Mete vèsyon an
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Konstwi APK debug
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/KayOu-debug.apk"

      - name: Konstwi epi siyen APK/AAB release
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/KayOu-release.apk" "$RUNNER_TEMP/aligned.apk"

          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/KayOu-release.aab"
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" "$GITHUB_WORKSPACE/KayOu-release.aab" "$KEY_ALIAS"

          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: KayOu-android
          path: |
            KayOu-debug.apk
            KayOu-release.apk
            KayOu-release.aab
          if-no-files-found: warn

      - name: Pibliye nan GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KayOu-debug.apk
            KayOu-release.apk
            KayOu-release.aab
          fail_on_unmatched_files: false
