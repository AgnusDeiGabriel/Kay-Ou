<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KayOu — Verifye Email Ou</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2C1810 0%, #4A2C1A 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 20px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  }

  .logo {
    font-size: 28px;
    font-weight: 800;
    color: #2C1810;
    text-align: center;
    margin-bottom: 6px;
  }
  .logo span { color: #E8622A; }

  .subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 28px;
  }

  .icon-wrap {
    text-align: center;
    font-size: 48px;
    margin-bottom: 20px;
  }

  .title {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a1a;
    text-align: center;
    margin-bottom: 8px;
  }

  .desc {
    font-size: 14px;
    color: #666;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .form-grp { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #555;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
    background: #fafafa;
  }
  input[type="password"]:focus { border-color: #E8622A; background: #fff; }

  .btn {
    width: 100%;
    padding: 14px;
    background: #E8622A;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s;
    margin-top: 4px;
  }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }

  .alert {
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .alert-err  { background: #FEE2E2; color: #B91C1C; }
  .alert-ok   { background: #D1FAE5; color: #065F46; }

  /* States */
  #state-loading, #state-invalid, #state-success { display: none; }
  #state-form { display: block; }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #f0e8e4;
    border-top-color: #E8622A;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #E8622A;
    text-decoration: none;
    font-weight: 600;
  }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">Kay<span>Ou</span></div>
  <div class="subtitle">Imobilye Ayiti</div>

  <!-- Loading -->
  <div id="state-loading">
    <div class="icon-wrap"><div class="spinner"></div></div>
    <div class="title">Ap verifye lyen an...</div>
  </div>

  <!-- Token invalid -->
  <div id="state-invalid">
    <div class="icon-wrap">❌</div>
    <div class="title">Lyen pa valid</div>
    <div class="desc" id="invalid-msg">Lyen sa a pa valid oswa li deja ekspire.</div>
    <a href="/" class="back-link">← Tounen akèy</a>
  </div>

  <!-- Form modpas -->
  <div id="state-form">
    <div class="icon-wrap">✉️</div>
    <div class="title">Konfime Kont Ou</div>
    <div class="desc">Antre modpas ou pou verifye email ou epi aktive kont ou.</div>

    <div class="alert alert-err" id="err-msg"></div>

    <div class="form-grp">
      <label>Modpas</label>
      <input type="password" id="inp-pass" placeholder="Antre modpas ou..." autocomplete="current-password">
    </div>

    <button class="btn" id="btn-verify" onclick="doVerify()">Verifye Kont Mwen →</button>
    <a href="/" class="back-link">← Tounen akèy</a>
  </div>

  <!-- Success -->
  <div id="state-success">
    <div class="icon-wrap">✅</div>
    <div class="title">Kont Verifye!</div>
    <div class="desc">Email ou verifye avèk siksè. Ou konekte kounye a — n ap voye ou akèy.</div>
  </div>
</div>

<script>
  const token = new URLSearchParams(window.location.search).get('token');

  function show(id) {
    ['state-loading','state-invalid','state-form','state-success']
      .forEach(s => document.getElementById(s).style.display = s === id ? 'block' : 'none');
  }

  async function checkToken() {
    if (!token) { show('state-invalid'); return; }
    show('state-loading');
    try {
      const res = await fetch('/api/auth/verify-email?token=' + encodeURIComponent(token));
      if (res.ok) {
        show('state-form');
        setTimeout(() => document.getElementById('inp-pass').focus(), 100);
      } else {
        const json = await res.json().catch(() => ({}));
        document.getElementById('invalid-msg').textContent = json.message || 'Lyen sa a pa valid.';
        show('state-invalid');
      }
    } catch {
      document.getElementById('invalid-msg').textContent = 'Erè koneksyon. Eseye ankò.';
      show('state-invalid');
    }
  }

  async function doVerify() {
    const pass = document.getElementById('inp-pass').value;
    const errEl = document.getElementById('err-msg');
    errEl.style.display = 'none';

    if (!pass) { errEl.textContent = 'Antre modpas ou!'; errEl.style.display = 'block'; return; }

    const btn = document.getElementById('btn-verify');
    btn.disabled = true;
    btn.textContent = '⏳ Tann...';

    try {
      const res = await fetch('/api/auth/verify-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pass })
      });
      const json = await res.json().catch(() => ({}));

      if (res.ok && json.data) {
        // Sove token pou koneksyon otomatik
        localStorage.setItem('ka_token',   json.data.accessToken);
        localStorage.setItem('ka_refresh', json.data.refreshToken);
        localStorage.setItem('ka_user',    JSON.stringify(json.data.user));
        show('state-success');
        setTimeout(() => { window.location.href = '/'; }, 2000);
      } else {
        errEl.textContent = json.message || 'Modpas ou pa kòrèk.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Verifye Kont Mwen →';
      }
    } catch {
      errEl.textContent = 'Erè koneksyon. Eseye ankò.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Verifye Kont Mwen →';
    }
  }

  document.getElementById('inp-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doVerify();
  });

  checkToken();
</script>
</body>
</html>
